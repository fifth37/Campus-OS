<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus OS — Student Hub &amp; Chill Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    input, textarea, select, .selectable-text {
      user-select: text;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070b14;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .os-glass {
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.11);
    }
    .os-window {
      background: rgba(15, 23, 42, 0.93);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.78);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .os-window.active-window {
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.88), 0 0 0 1px rgba(99, 102, 241, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 3px;
    }
    .wallpaper-nebula {
      background: radial-gradient(circle at 18% 22%, rgba(99, 102, 241, 0.38), transparent 45%),
                  radial-gradient(circle at 82% 78%, rgba(14, 165, 233, 0.3), transparent 50%),
                  linear-gradient(135deg, #060913 0%, #0f172a 55%, #091326 100%);
    }
    .wallpaper-sunset {
      background: radial-gradient(circle at 22% 20%, rgba(244, 63, 94, 0.32), transparent 45%),
                  radial-gradient(circle at 78% 80%, rgba(245, 158, 11, 0.25), transparent 50%),
                  linear-gradient(135deg, #0f0714 0%, #1e1024 55%, #110c1d 100%);
    }
    .wallpaper-mint {
      background: radial-gradient(circle at 25% 25%, rgba(16, 185, 129, 0.32), transparent 45%),
                  radial-gradient(circle at 80% 75%, rgba(45, 212, 191, 0.25), transparent 50%),
                  linear-gradient(135deg, #040d0b 0%, #091e1a 55%, #06141a 100%);
    }
    .wallpaper-midnight {
      background: radial-gradient(circle at 50% 0%, rgba(148, 163, 184, 0.16), transparent 55%),
                  linear-gradient(180deg, #080b12 0%, #111827 100%);
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ==========================================
       1. LOGIN / BOOT SCREEN
       ========================================== -->
  <div id="auth-view" class="h-screen w-screen flex items-center justify-center p-4 wallpaper-nebula overflow-y-auto">

      <div class="flex flex-col items-center text-center mb-7">

          🚀
        </div>
        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-indigo-500/15 border border-indigo-400/25 text-indigo-300 text-[11px] font-medium mb-2">
          <span>Campus OS</span>
          <span>•</span>
          <span>Study, Focus &amp; Chill</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Welcome to Campus OS</h1>

        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="relative my-5">

          <div class="w-full border-t border-slate-700/80"></div>
        </div>
        <div class="relative flex justify-center text-[11px] uppercase">
          <span class="bg-slate-900 px-3 text-slate-400 tracking-wider">Or Email Login</span>
        </div>
      </div>

      <!-- Status / Error Message Banner -->
      <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs leading-relaxed"></div>

      <!-- Email / Password Form -->
      <form id="email-auth-form" onsubmit="handleEmailAuth(event)" class="space-y-3.5">
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
          <input id="email-input" type="email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/70 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition" />
        </div>
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
          <input id="password-input" type="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/70 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition" />

        <button id="submit-auth-btn" type="submit" class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-indigo-600/20 cursor-pointer">

        <button onclick="enterDemoMode()" class="text-slate-400 hover:text-white font-medium cursor-pointer">
          Guest Mode →
        </button>

      document.getElementById('submit-auth-btn').textContent = isSignUpMode ? 'Create Account' : 'Boot into Desktop';
      document.getElementById('toggle-auth-mode').textContent = isSignUpMode ? 'Already have an account? Sign In' : 'Create an Account';
    }

    async function signInWithGoogle() {
      hideAlert();
      const redirectUrl = window.location.origin + window.location.pathname;
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectUrl }
      });
      if (error) showAlert('Google Auth Error: ' + error.message);

    async function handleEmailAuth(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const btn = document.getElementById('submit-auth-btn');
      btn.disabled = true;
      btn.textContent = isSignUpMode ? 'Creating account...' : 'Booting...';

      try {
        if (isSignUpMode) {
          const redirectUrl = window.location.origin + window.location.pathname;
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: redirectUrl }
          });
          if (error) throw error;
          if (data.session) {
            bootDesktop(data.user);
          } else {
            showAlert('Account created! Check your email to confirm your address before signing in.', false);
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (data.user) bootDesktop(data.user);
        }
      } catch (err) {
        showAlert(err.message || 'Authentication failed.');
      } finally {
        btn.disabled = false;
        btn.textContent = isSignUpMode ? 'Create Account' : 'Boot into Desktop';
      }
    }

    function renderDock() {

        dock.appendChild(btn);

    function openApp(appId) {
      const app = APPS[appId];
      if (!app) return;

      if (openWindows[appId]) {
        openWindows[appId].minimized = false;
        const el = document.getElementById(`win-${appId}`);
        if (el) el.classList.remove('hidden');
        focusWindow(appId);
        renderDock();
        return;
      }

      const offset = Object.keys(openWindows).length * 24;
      const isMobile = window.innerWidth < 768;

      openWindows[appId] = {
        minimized: false,
        maximized: isMobile,
        x: isMobile ? 0 : 135 + offset,
        y: isMobile ? 0 : 24 + offset
      };

      const winEl = document.createElement('div');
      winEl.id = `win-${appId}`;
      winEl.className = 'os-window pointer-events-auto absolute rounded-2xl flex flex-col overflow-hidden';
      winEl.style.zIndex = ++topZIndex;

      if (isMobile) {
        winEl.style.inset = '8px';
      } else {
        winEl.style.width = `${app.width}px`;
        winEl.style.height = `${app.height}px`;
        winEl.style.left = `${openWindows[appId].x}px`;
        winEl.style.top = `${openWindows[appId].y}px`;
      }

      winEl.onmousedown = () => focusWindow(appId);

      winEl.innerHTML = `
        <div onmousedown="startDrag(event, '${appId}')" class="h-10 px-4 bg-slate-950/80 border-b border-white/10 flex items-center justify-between cursor-move shrink-0">
          <div class="flex items-center gap-2">

          </div>
          <div class="flex items-center gap-1.5" onmousedown="event.stopPropagation()">
            <button onclick="minimizeWindow('${appId}')" class="w-6 h-6 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white text-xs flex items-center justify-center cursor-pointer" title="Minimize">─</button>
            <button onclick="toggleMaximize('${appId}')" class="w-6 h-6 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white text-xs flex items-center justify-center cursor-pointer" title="Maximize">□</button>
            <button onclick="closeWindow('${appId}')" class="w-6 h-6 rounded-lg hover:bg-rose-500/80 text-slate-400 hover:text-white text-xs flex items-center justify-center cursor-pointer" title="Close">✕</button>
          </div>

    function focusWindow(appId) {
      document.querySelectorAll('.os-window').forEach(w => w.classList.remove('active-window'));
      const el = document.getElementById(`win-${appId}`);
      if (el) {
        el.style.zIndex = ++topZIndex;

    function minimizeWindow(appId) {
      if (!openWindows[appId]) return;
      openWindows[appId].minimized = true;
      const el = document.getElementById(`win-${appId}`);
      if (el) el.classList.add('hidden');
      document.getElementById('top-active-app').textContent = 'Desktop';

    }

    function toggleMaximize(appId) {
      const state = openWindows[appId];
      const el = document.getElementById(`win-${appId}`);
      const app = APPS[appId];
      if (!state || !el) return;

      state.maximized = !state.maximized;
      if (state.maximized) {
        el.style.left = '8px';
        el.style.top = '8px';
        el.style.width = 'calc(100% - 16px)';
        el.style.height = 'calc(100% - 16px)';
      } else {
        el.style.left = `${state.x}px`;
        el.style.top = `${state.y}px`;
        el.style.width = `${app.width}px`;
        el.style.height = `${app.height}px`;
      }
      focusWindow(appId);
    }

    function closeWindow(appId) {
      if (appId === 'arcade') clearInterval(snakeInterval);
      delete openWindows[appId];

      document.getElementById('top-active-app').textContent = 'Desktop';
      renderDock();

    // Window Dragging
    let dragInfo = null;
    function startDrag(e, appId) {
      const state = openWindows[appId];
      if (!state || state.maximized) return;
      const el = document.getElementById(`win-${appId}`);
      dragInfo = { appId, startX: e.clientX - el.offsetLeft, startY: e.clientY - el.offsetTop };
      focusWindow(appId);
    }

    window.addEventListener('mousemove', (e) => {
      if (!dragInfo) return;
      const el = document.getElementById(`win-${dragInfo.appId}`);
      if (!el) return;
      const newX = Math.max(0, Math.min(window.innerWidth - 200, e.clientX - dragInfo.startX));
      const newY = Math.max(0, Math.min(window.innerHeight - 120, e.clientY - dragInfo.startY));
      el.style.left = `${newX}px`;
      el.style.top = `${newY}px`;
      openWindows[dragInfo.appId].x = newX;
      openWindows[dragInfo.appId].y = newY;
    });

    window.addEventListener('mouseup', () => { dragInfo = null; });

    // ==========================================
    // YOUTUBE SEARCH & URL PARSER
    // ==========================================
    function parseYouTubeInput(input) {
      const raw = input.trim();
      if (!raw) return null;

      // 1. Check for playlist URL
      const listMatch = raw.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      if (listMatch && !raw.includes('watch?v=')) {
        return { type: 'playlist', id: listMatch[1], title: 'YouTube Playlist' };
      }

      // 2. Check for direct video URL or 11-char video ID
      const vidMatch = raw.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/) ||
                       (raw.length === 11 && /^[a-zA-Z0-9_-]{11}$/.test(raw) ? [null, raw] : null);

      if (vidMatch) {
        return { type: 'video', id: vidMatch[1], title: `YouTube Video (${vidMatch[1]})` };
      }

      if (listMatch) {
        return { type: 'playlist', id: listMatch[1], title: 'YouTube Playlist' };
      }

      // 3. Otherwise treat input as a YouTube Search Query
      return { type: 'search', query: raw, id: raw, title: `Search: "${raw}"` };
    }

    function getYouTubeEmbedUrl(source) {
      const auto = source.autoplay ? '1' : '0';
      if (source.type === 'search') {
        return `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(source.query || source.id)}&autoplay=${auto}&rel=0`;
      }
      if (source.type === 'playlist') {
        return `https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(source.id)}&autoplay=${auto}&rel=0`;
      }
      return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(source.id)}?autoplay=${auto}&rel=0`;
    }

    function playYouTubePreset(id, type, title, query = '') {
      activeYtSource = { id, type, title, query: query || id, autoplay: true };
      renderAppContent('youtube');
    }

    function handleYouTubeSearchOrUrl(e) {
      e.preventDefault();
      const input = document.getElementById('yt-url-input');
      const parsed = parseYouTubeInput(input.value);
      if (!parsed) return;
      activeYtSource = {
        id: parsed.id,

    // ==========================================
    // FOCUS TIMER & AMBIENT AUDIO ENGINE
    // ==========================================
    let pomodoroSeconds = 25 * 60;
    let pomodoroRunning = false;
    let pomodoroInterval = null;
    let audioCtx = null;
    let ambientNode = null;
    let activeAmbientType = 'off';

    function formatTimer(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setPomodoroPreset(mins) {
      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
      pomodoroSeconds = mins * 60;
      renderAppContent('focus');
    }

    function togglePomodoro() {
      if (pomodoroRunning) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
        renderAppContent('focus');
      } else {
        pomodoroRunning = true;
        renderAppContent('focus');
        pomodoroInterval = setInterval(() => {
          if (pomodoroSeconds > 0) {
            pomodoroSeconds--;
            const disp = document.getElementById('pomo-display');
            if (disp) disp.textContent = formatTimer(pomodoroSeconds);
          } else {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            renderAppContent('focus');
          }
        }, 1000);
      }
    }

    function toggleAmbientSound(type) {
      stopAmbientSound();
      if (activeAmbientType === type || type === 'off') {
        activeAmbientType = 'off';
        renderAppContent('focus');
        return;
      }

      activeAmbientType = type;

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= type === 'rain' ? 1.8 : 0.9;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = type === 'rain' ? 950 : 320;

        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.18;

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        whiteNoise.start(0);
        ambientNode = whiteNoise;
      } catch (e) {
        console.warn('Audio init blocked', e);
      }
      renderAppContent('focus');
    }

    function stopAmbientSound() {
      if (ambientNode) {
        try { ambientNode.stop(); } catch (_) {}
        ambientNode = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch (_) {}
        audioCtx = null;
      }
    }

    // ==========================================
    // ARCADE ZONE (SNAKE + TIC-TAC-TOE)
    // ==========================================
    let arcadeTab = 'snake';
    let snakeInterval = null;
    let snake = [{ x: 8, y: 8 }];
    let food = { x: 12, y: 8 };
    let dir = { x: 1, y: 0 };
    let snakeScore = 0;

    let tttBoard = Array(9).fill('');
    let tttTurn = 'X';
    let tttWinner = null;

    function switchArcadeTab(tab) {
      arcadeTab = tab;
      clearInterval(snakeInterval);
      renderAppContent('arcade');
    }

    function startSnakeGame() {
      clearInterval(snakeInterval);
      snake = [{ x: 8, y: 8 }];
      dir = { x: 1, y: 0 };
      snakeScore = 0;
      food = { x: Math.floor(Math.random() * 18), y: Math.floor(Math.random() * 14) };

      snakeInterval = setInterval(() => {
        const canvas = document.getElementById('snake-canvas');
        if (!canvas) { clearInterval(snakeInterval); return; }
        const ctx = canvas.getContext('2d');

        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 15 || snake.some(s => s.x === head.x && s.y === head.y)) {
          clearInterval(snakeInterval);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fb7185';
          ctx.font = 'bold 18px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`Game Over! Score: ${snakeScore}`, canvas.width / 2, canvas.height / 2);
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          snakeScore++;
          const scoreEl = document.getElementById('snake-score-label');
          if (scoreEl) scoreEl.textContent = snakeScore;
          food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 15) };
        } else {
          snake.pop();
        }

        ctx.fillStyle = '#090e1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(food.x * 20 + 10, food.y * 20 + 10, 7, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
          ctx.fillRect(seg.x * 20 + 1, seg.y * 20 + 1, 18, 18);
        });
      }, 130);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && openWindows['arcade'] && arcadeTab === 'snake') {
        e.preventDefault();
        if (e.key === 'ArrowUp' && dir.y === 0) dir = { x: 0, y: -1 };
        if (e.key === 'ArrowDown' && dir.y === 0) dir = { x: 0, y: 1 };
        if (e.key === 'ArrowLeft' && dir.x === 0) dir = { x: -1, y: 0 };
        if (e.key === 'ArrowRight' && dir.x === 0) dir = { x: 1, y: 0 };
      }
    });

    function playTtt(idx) {
      if (tttBoard[idx] || tttWinner) return;
      tttBoard[idx] = tttTurn;
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (const [a,b,c] of wins) {
        if (tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
          tttWinner = `${tttBoard[a]} Wins!`;
        }
      }
      if (!tttWinner && !tttBoard.includes('')) tttWinner = 'Draw!';
      tttTurn = tttTurn === 'X' ? 'O' : 'X';
      renderAppContent('arcade');
    }

    function resetTtt() {
      tttBoard = Array(9).fill('');
      tttTurn = 'X';
      tttWinner = null;
      renderAppContent('arcade');
    }

    // ==========================================

    function renderAppContent(appId) {

      if (!body) return;

      // 0. YOUTUBE MUSIC & VIDEO PLAYER (WITH SEARCH + URL SUPPORT)
      if (appId === 'youtube') {
        const embedUrl = getYouTubeEmbedUrl(activeYtSource);
        body.innerHTML = `
          <div class="space-y-3.5">
            <!-- Search or URL Input Bar -->
            <form onsubmit="handleYouTubeSearchOrUrl(event)" class="flex gap-2">

              <button type="submit" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold cursor-pointer shrink-0">Search / Play</button>
            </form>

            <!-- Responsive 16:9 YouTube Player -->
            <div class="relative w-full rounded-xl overflow-hidden bg-black border border-white/10 shadow-lg" style="padding-top: 52%;">
              <iframe
                class="absolute inset-0 w-full h-full"
                src="${embedUrl}"
                title="${activeYtSource.title}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
              </iframe>
            </div>

            <!-- Now Playing Bar -->
            <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-slate-950/60 border border-white/10">
              <div class="overflow-hidden">
                <p class="text-[10px] uppercase tracking-wider text-rose-400 font-semibold">Now Playing ${activeYtSource.type === 'search' ? '(Use player playlist icon ☰ to skip results)' : '• Minimize (─) for background audio'}</p>
                <p class="text-xs font-semibold text-white truncate">${activeYtSource.title}</p>
              </div>
              <button onclick="saveCurrentYtFavorite()" class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] font-medium text-white shrink-0 cursor-pointer">+ Save</button>
            </div>

            <!-- Quick Study & Chill Stations -->
            <div>
              <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Instant Study &amp; Chill Stations</p>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                ${YT_PRESETS.map(p => `
                  <button onclick="playYouTubePreset('${p.id}', '${p.type}', '${p.name.replace(/'/g, "\\'")}')" class="p-2 rounded-xl border text-[11px] font-medium text-left truncate cursor-pointer transition ${
                    activeYtSource.id === p.id ? 'bg-rose-500/20 border-rose-400/50 text-white' : 'bg-slate-950/50 border-white/10 hover:bg-white/10 text-slate-300'
                  }">${p.name}</button>
                `).join('')}
              </div>
            </div>

            <!-- Saved Searches, Tracks & Playlists -->
            <div>
              <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Your Saved Tracks &amp; Searches</p>
              <div class="space-y-1.5">
                ${ytFavorites.map((fav, i) => `
                  <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-950/45 border border-white/5 hover:border-white/15">
                    <button onclick="playYouTubePreset('${fav.id.replace(/'/g, "\\'")}', '${fav.type}', '${fav.title.replace(/'/g, "\\'")}', '${fav.id.replace(/'/g, "\\'")}')" class="text-xs text-slate-200 hover:text-rose-400 font-medium truncate text-left flex-1 cursor-pointer">
                      ▶ ${fav.title}
                    </button>
                    <button onclick="removeYtFavorite(${i})" class="text-[11px] text-slate-500 hover:text-rose-400 ml-2 cursor-pointer">✕</button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // 1. FOCUS & LO-FI TIMER
      if (appId === 'focus') {
        body.innerHTML = `
          <div class="flex flex-col items-center justify-center text-center space-y-5 py-2">
            <div class="flex gap-2">
              <button onclick="setPomodoroPreset(25)" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium cursor-pointer">25m Focus</button>
              <button onclick="setPomodoroPreset(45)" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium cursor-pointer">45m Deep Work</button>
              <button onclick="setPomodoroPreset(5)" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium cursor-pointer">5m Break</button>
            </div>

            <div class="w-48 h-48 rounded-full border-4 border-indigo-500/40 bg-slate-950/60 flex flex-col items-center justify-center shadow-inner">
              <span id="pomo-display" class="font-mono-code text-4xl font-bold text-white tracking-wider">${formatTimer(pomodoroSeconds)}</span>
              <span class="text-[11px] text-indigo-300 mt-1">${pomodoroRunning ? 'Session Active' : 'Paused'}</span>
            </div>

            <button onclick="togglePomodoro()" class="px-8 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition cursor-pointer">
              ${pomodoroRunning ? 'Pause Timer' : 'Start Focus Sprint'}
            </button>

            <div class="w-full pt-4 border-t border-white/10">
              <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2.5">Built-In Ambient Soundscape</p>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="toggleAmbientSound('rain')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer transition ${activeAmbientType === 'rain' ? 'bg-sky-500/25 border-sky-400 text-white' : 'bg-slate-950/50 border-white/10 text-slate-300'}">🌧️ Soft Rain</button>
                <button onclick="toggleAmbientSound('lofi')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer transition ${activeAmbientType === 'lofi' ? 'bg-indigo-500/25 border-indigo-400 text-white' : 'bg-slate-950/50 border-white/10 text-slate-300'}">🌊 Deep Hum</button>
                <button onclick="toggleAmbientSound('off')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer transition ${activeAmbientType === 'off' ? 'bg-white/10 border-white/20 text-white' : 'bg-slate-950/50 border-white/10 text-slate-400'}">🔇 Mute</button>
              </div>
            </div>
          </div>
        `;
      }

      // 2. TASKS & GOALS
      if (appId === 'tasks') {
        body.innerHTML = `
          <div class="space-y-4">
            <form onsubmit="addOsTask(event)" class="flex gap-2">
              <input id="os-task-title" type="text" required placeholder="Add a study task, goal, or reminder..." class="flex-1 px-3.5 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-500" />
              <select id="os-task-tag" class="px-3 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-slate-300 focus:outline-none">
                <option value="Study">Study</option>
                <option value="Focus">Focus</option>
                <option value="Personal">Personal</option>
                <option value="Chill">Chill</option>
              </select>
              <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold cursor-pointer">Add</button>
            </form>

            <div class="space-y-2">
              ${tasks.map(t => `
                <div onclick="toggleOsTask(${t.id})" class="p-3 rounded-xl bg-slate-950/50 border border-white/10 hover:border-white/20 flex items-center justify-between cursor-pointer">
                  <div class="flex items-center gap-3">
                    <span class="w-5 h-5 rounded-full flex items-center justify-center border text-xs ${t.done ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'border-slate-600'}">${t.done ? '✓' : ''}</span>
                    <div>
                      <p class="text-xs font-medium ${t.done ? 'line-through text-slate-500' : 'text-white'}">${t.title}</p>
                      <span class="text-[10px] text-emerald-400">${t.tag}</span>
                    </div>
                  </div>
                  <button onclick="event.stopPropagation(); deleteOsTask(${t.id})" class="text-[11px] text-slate-500 hover:text-rose-400 px-2 py-1 cursor-pointer">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 3. SCRATCHPAD
      if (appId === 'notes') {
        const currentNote = notes.find(n => n.id === activeNoteId) || notes[0];
        body.innerHTML = `
          <div class="grid grid-cols-3 gap-4 h-full min-h-[330px]">
            <div class="col-span-1 border-r border-white/10 pr-3 flex flex-col justify-between">
              <div class="space-y-1.5 overflow-y-auto">
                <button onclick="createNewNote()" class="w-full py-2 px-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 text-amber-300 text-xs font-semibold mb-2 cursor-pointer">+ New Note</button>
                ${notes.map(n => `
                  <div onclick="selectNote(${n.id})" class="p-2.5 rounded-xl cursor-pointer transition ${n.id === currentNote?.id ? 'bg-white/15 border border-white/20' : 'hover:bg-white/5'}">
                    <p class="text-xs font-semibold text-white truncate">${n.title || 'Untitled'}</p>
                    <p class="text-[10px] text-slate-400 mt-0.5">${n.updated}</p>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="col-span-2 flex flex-col gap-2">
              ${currentNote ? `
                <input type="text" value="${currentNote.title}" oninput="updateNoteField(${currentNote.id}, 'title', this.value)" class="w-full px-3 py-2 rounded-xl bg-slate-950/60 border border-white/10 text-sm font-bold text-white focus:outline-none focus:border-amber-400" />
                <textarea oninput="updateNoteField(${currentNote.id}, 'content', this.value)" class="flex-1 w-full p-3 rounded-xl bg-slate-950/60 border border-white/10 text-xs text-slate-200 leading-relaxed focus:outline-none focus:border-amber-400 resize-none font-mono-code">${currentNote.content}</textarea>
                <div class="flex justify-between items-center text-[10px] text-slate-400">
                  <span>Auto-saved locally</span>
                  <button onclick="deleteNote(${currentNote.id})" class="text-rose-400 hover:underline cursor-pointer">Delete</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      // 4. ARCADE ZONE
      if (appId === 'arcade') {
        body.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex gap-2">
                <button onclick="switchArcadeTab('snake')" class="px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer ${arcadeTab === 'snake' ? 'bg-rose-600 text-white' : 'bg-white/10 text-slate-300'}">🐍 Snake</button>
                <button onclick="switchArcadeTab('ttt')" class="px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer ${arcadeTab === 'ttt' ? 'bg-rose-600 text-white' : 'bg-white/10 text-slate-300'}">❌⭕ Tic-Tac-Toe</button>
              </div>
              ${arcadeTab === 'snake' ? `<span class="text-xs font-mono-code text-emerald-400">Score: <strong id="snake-score-label">0</strong></span>` : ''}
            </div>

            ${arcadeTab === 'snake' ? `
              <div class="flex flex-col items-center space-y-3">
                <canvas id="snake-canvas" width="400" height="300" class="rounded-xl border border-white/15 bg-slate-950"></canvas>
                <div class="flex items-center gap-3">
                  <button onclick="startSnakeGame()" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold cursor-pointer">Start / Restart</button>
                  <span class="text-[11px] text-slate-400">Use Arrow Keys ↑ ↓ ← →</span>
                </div>
              </div>
            ` : `
              <div class="flex flex-col items-center space-y-4 py-2">
                <p class="text-sm font-bold text-indigo-300">${tttWinner || `Turn: ${tttTurn}`}</p>
                <div class="grid grid-cols-3 gap-2">
                  ${tttBoard.map((cell, i) => `
                    <button onclick="playTtt(${i})" class="w-20 h-20 rounded-xl bg-slate-950/70 border border-white/15 hover:border-indigo-400 text-2xl font-bold flex items-center justify-center cursor-pointer ${cell === 'X' ? 'text-rose-400' : 'text-sky-400'}">${cell}</button>
                  `).join('')}
                </div>
                <button onclick="resetTtt()" class="px-4 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold cursor-pointer">Reset Board</button>
              </div>
            `}
          </div>
        `;
      }

      // 5. CAMPUS LOUNGE
      if (appId === 'lounge') {
        body.innerHTML = `
          <div class="space-y-4">
            <form onsubmit="addLoungePost(event)" class="flex gap-2">
              <input id="lounge-input" type="text" required placeholder="Share a study tip, vibe, or thought with the lounge..." class="flex-1 px-3.5 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-white focus:outline-none focus:border-sky-500" />
              <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold cursor-pointer">Post</button>
            </form>

            <div class="space-y-2.5">
              ${loungePosts.map(p => `
                <div class="p-3.5 rounded-xl bg-slate-950/55 border border-white/10 space-y-1.5">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-white">${p.author}</span>
                      <span class="px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-300 text-[10px]">${p.tag}</span>
                    </div>
                    <span class="text-[10px] text-slate-500">${p.time}</span>
                  </div>
                  <p class="text-xs text-slate-200 leading-relaxed selectable-text">${p.text}</p>
                  <button onclick="likeLoungePost(${p.id})" class="text-[11px] text-slate-400 hover:text-rose-400 cursor-pointer">❤️ ${p.likes}</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 6. STUDY BUDDY (FLASHCARDS)
      if (appId === 'study') {
        const card = flashcards[currentCardIndex] || { q: 'No cards yet', a: 'Add one below!' };
        body.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <p class="text-xs font-semibold uppercase tracking-wider text-cyan-300">Active Recall Flashcards (${currentCardIndex + 1}/${flashcards.length})</p>
              <span class="text-[11px] text-slate-400">Click card to flip</span>
            </div>

            <div onclick="flipFlashcard()" class="min-h-[150px] p-6 rounded-2xl bg-gradient-to-br from-cyan-600/20 to-indigo-600/20 border border-cyan-400/30 flex flex-col items-center justify-center text-center cursor-pointer transition hover:border-cyan-400/60">
              <span class="text-[10px] uppercase tracking-widest text-cyan-300 mb-2">${isCardFlipped ? 'Answer' : 'Question'}</span>
              <p class="text-sm font-semibold text-white leading-relaxed">${isCardFlipped ? card.a : card.q}</p>
            </div>

            <div class="flex items-center justify-between">
              <button onclick="prevFlashcard()" class="px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium cursor-pointer">← Previous</button>
              <button onclick="flipFlashcard()" class="px-4 py-1.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold cursor-pointer">Flip Card</button>
              <button onclick="nextFlashcard()" class="px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium cursor-pointer">Next →</button>
            </div>

            <form onsubmit="addFlashcard(event)" class="pt-3 border-t border-white/10 grid grid-cols-1 sm:grid-cols-2 gap-2">
              <input id="fc-q" type="text" required placeholder="New question / term..." class="px-3 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-white" />
              <div class="flex gap-2">
                <input id="fc-a" type="text" required placeholder="Answer / definition..." class="flex-1 px-3 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-white" />
                <button type="submit" class="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer">+</button>
              </div>
            </form>
          </div>
        `;
      }

      // 7. PERSONALIZE & SETTINGS (Single home for themes & profile)
      if (appId === 'settings') {
        body.innerHTML = `
          <div class="space-y-5">
            <div>
              <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">Desktop Atmosphere</p>
              <div class="grid grid-cols-2 gap-2.5">
                <button onclick="setWallpaper('wallpaper-nebula')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer ${userPrefs.wallpaper === 'wallpaper-nebula' ? 'border-indigo-400 bg-indigo-500/20 text-white' : 'border-white/10 bg-slate-950/50 text-slate-300'}">🌌 Nebula Focus</button>
                <button onclick="setWallpaper('wallpaper-sunset')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer ${userPrefs.wallpaper === 'wallpaper-sunset' ? 'border-rose-400 bg-rose-500/20 text-white' : 'border-white/10 bg-slate-950/50 text-slate-300'}">🌅 Lo-Fi Sunset</button>
                <button onclick="setWallpaper('wallpaper-mint')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer ${userPrefs.wallpaper === 'wallpaper-mint' ? 'border-emerald-400 bg-emerald-500/20 text-white' : 'border-white/10 bg-slate-950/50 text-slate-300'}">🌿 Matcha Chill</button>
                <button onclick="setWallpaper('wallpaper-midnight')" class="p-2.5 rounded-xl border text-xs font-medium cursor-pointer ${userPrefs.wallpaper === 'wallpaper-midnight' ? 'border-slate-400 bg-slate-500/20 text-white' : 'border-white/10 bg-slate-950/50 text-slate-300'}">🌑 Midnight OLED</button>
              </div>
            </div>

            <form onsubmit="saveUserPrefs(event)" class="space-y-3 pt-3 border-t border-white/10">
              <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Your Desktop Identity</p>
              <div>
                <label class="block text-[11px] text-slate-400 mb-1">Display Nickname</label>
                <input id="pref-nick" type="text" value="${userPrefs.nickname}" class="w-full px-3 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-white" />
              </div>
              <div>
                <label class="block text-[11px] text-slate-400 mb-1">Mood / Status Line</label>
                <input id="pref-status" type="text" value="${userPrefs.status}" class="w-full px-3 py-2 rounded-xl bg-slate-950/70 border border-slate-700 text-xs text-white" />
              </div>
              <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer">Save Changes</button>
            </form>
          </div>
        `;
      }
    }

    // ==========================================
    // HELPER ACTIONS
    // ==========================================
    function addOsTask(e) {
      e.preventDefault();
      const titleInput = document.getElementById('os-task-title');
      const tag = document.getElementById('os-task-tag').value;
      if (!titleInput.value.trim()) return;
      tasks.unshift({ id: Date.now(), title: titleInput.value.trim(), tag, done: false });
      localStorage.setItem('campus_os_tasks_v2', JSON.stringify(tasks));
      updateTaskWidget();
      renderAppContent('tasks');
    }

    function toggleOsTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      localStorage.setItem('campus_os_tasks_v2', JSON.stringify(tasks));
      updateTaskWidget();
      renderAppContent('tasks');
    }

    function deleteOsTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem('campus_os_tasks_v2', JSON.stringify(tasks));
      updateTaskWidget();
      renderAppContent('tasks');
    }

    function updateTaskWidget() {
      document.getElementById('widget-tasks-count').textContent = tasks.filter(t => !t.done).length;
    }

    function createNewNote() {
      const newNote = { id: Date.now(), title: 'New Scratchpad', updated: 'Just now', content: '' };
      notes.unshift(newNote);
      activeNoteId = newNote.id;
      localStorage.setItem('campus_os_notes_v2', JSON.stringify(notes));
      renderAppContent('notes');
    }

    function selectNote(id) {
      activeNoteId = id;
      renderAppContent('notes');
    }

    function updateNoteField(id, field, val) {
      notes = notes.map(n => n.id === id ? { ...n, [field]: val, updated: 'Just now' } : n);
      localStorage.setItem('campus_os_notes_v2', JSON.stringify(notes));
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      activeNoteId = notes[0]?.id || null;
      localStorage.setItem('campus_os_notes_v2', JSON.stringify(notes));
      renderAppContent('notes');
    }

    function addLoungePost(e) {
      e.preventDefault();
      const input = document.getElementById('lounge-input');
      if (!input.value.trim()) return;
      loungePosts.unshift({
        id: Date.now(),
        author: userPrefs.nickname,
        tag: 'Lounge',
        text: input.value.trim(),
        likes: 1,
        time: 'Just now'
      });
      localStorage.setItem('campus_os_lounge', JSON.stringify(loungePosts));
      renderAppContent('lounge');
    }

    function likeLoungePost(id) {
      loungePosts = loungePosts.map(p => p.id === id ? { ...p, likes: p.likes + 1 } : p);
      localStorage.setItem('campus_os_lounge', JSON.stringify(loungePosts));
      renderAppContent('lounge');
    }

    function flipFlashcard() {
      isCardFlipped = !isCardFlipped;
      renderAppContent('study');
    }

    function nextFlashcard() {
      isCardFlipped = false;
      currentCardIndex = (currentCardIndex + 1) % flashcards.length;
      renderAppContent('study');
    }

    function prevFlashcard() {
      isCardFlipped = false;
      currentCardIndex = (currentCardIndex - 1 + flashcards.length) % flashcards.length;
      renderAppContent('study');
    }

    function addFlashcard(e) {
      e.preventDefault();
      const q = document.getElementById('fc-q').value.trim();
      const a = document.getElementById('fc-a').value.trim();
      if (!q || !a) return;
      flashcards.push({ q, a });
      currentCardIndex = flashcards.length - 1;
      isCardFlipped = false;
      localStorage.setItem('campus_os_cards', JSON.stringify(flashcards));
      renderAppContent('study');
    }

    function applyWallpaper(cls) {
      const desktop = document.getElementById('desktop-view');
      const auth = document.getElementById('auth-view');
      ['wallpaper-nebula', 'wallpaper-sunset', 'wallpaper-mint', 'wallpaper-midnight'].forEach(c => {
        desktop.classList.remove(c);
        auth.classList.remove(c);
      });
      desktop.classList.add(cls);
      auth.classList.add(cls);
    }

    function setWallpaper(cls) {
      userPrefs.wallpaper = cls;
      localStorage.setItem('campus_os_prefs', JSON.stringify(userPrefs));
      applyWallpaper(cls);
      renderAppContent('settings');
    }

    function saveUserPrefs(e) {
      e.preventDefault();
      userPrefs.nickname = document.getElementById('pref-nick').value.trim() || userPrefs.nickname;
      userPrefs.status = document.getElementById('pref-status').value.trim() || userPrefs.status;
      localStorage.setItem('campus_os_prefs', JSON.stringify(userPrefs));
      syncUserUI();
      renderAppContent('settings');
    }
  </script>
</body>
</html>
